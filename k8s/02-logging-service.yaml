# logging-service Deployment
# K8s Service provides stable DNS + load balancing across all replicas.
# No manual registration needed - K8s handles service discovery automatically.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  namespace: default
spec:
  replicas: 3  # 3 instances - demonstrates multi-instance support
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      containers:
        - name: logging-service
          image: logging-service:latest
          imagePullPolicy: Never  # use local Minikube image
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            # All config injected from ConfigMap (Hazelcast settings)
            - name: HZ_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HZ_HOSTS
            - name: HZ_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HZ_CLUSTER_NAME
            - name: HZ_MAP_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: HZ_MAP_NAME
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
# K8s Service for logging-service
# facade-service uses DNS name "logging-service" to reach any healthy pod
apiVersion: v1
kind: Service
metadata:
  name: logging-service
  namespace: default
spec:
  selector:
    app: logging-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
